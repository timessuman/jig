name: Rule
description: A rule is unclear or wrong, an agent misreads it, or a rule is missing.
labels: [enhancement]
body:
  - type: input
    id: rule
    attributes:
      label: Rule
      description: The rule's id, or "new" for a rule that doesn't exist yet.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: What the agent built, or what the rule says, and why it's wrong.
    validations:
      required: true
  - type: textarea
    id: without
    attributes:
      label: Without the rule
      description: For a new rule, what an agent builds without it. A rule only earns its place if agents get this wrong on their own.
  - type: input
    id: setup
    attributes:
      label: Jig version, framework, and agent
      placeholder: 0.27.0, SvelteKit, Codex
