name: Install or setup problem
description: init, install, update or the agent setup failed, or did something unexpected.
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: npx jig-ui@latest init
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      render: text
  - type: input
    id: setup
    attributes:
      label: Jig version, OS, Node version, framework, and agent
      placeholder: 0.27.0, Windows 11, Node 22, Astro, Cursor
    validations:
      required: true
