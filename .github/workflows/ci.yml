# Jig runs wherever its users do: Linux, macOS and Windows, on every Node it
# supports (engines: >=20). A pass here, on all of them, is what lets the
# README say so.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Several tests make commits in a temporary repository.
      - run: git config --global user.email ci@example.test
      - run: git config --global user.name ci
      - run: npm ci
      - run: npm test
